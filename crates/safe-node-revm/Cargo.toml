[package]
name = "safe-node-revm"
description = "A constant-rate, proof-verifying Safe Node database adapter for revm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
readme.workspace = true
repository.workspace = true
keywords = ["ethereum", "evm", "revm", "privacy", "tdx"]
categories = ["cryptography::cryptocurrencies"]

[dependencies]
alloy-primitives.workspace = true
alloy-rlp.workspace = true
alloy-trie.workspace = true
hex.workspace = true
revm.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-trait.workspace = true
base64.workspace = true
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls-manual-roots", "http2"] }
rustls = { version = "0.23.35", default-features = false, features = ["ring", "std", "tls12"] }
sha2.workspace = true
tokio.workspace = true
x509-parser = "0.18.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# revm currently reaches getrandom 0.2 through elliptic-curve types.
getrandom = { version = "0.2.16", features = ["js"] }

[dev-dependencies]
async-trait.workspace = true
