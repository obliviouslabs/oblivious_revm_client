[workspace]
members = [
    "crates/safe-node-revm",
    "crates/safe-node-revm-cli",
    "crates/safe-node-revm-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
authors = ["Oblivious Labs"]
readme = "README.md"
repository = "https://github.com/obliviouslabs/oblivious_revm_client"

[workspace.dependencies]
anyhow = "1.0.100"
alloy-primitives = { version = "=1.6.1", features = ["serde"] }
alloy-rlp = "0.3.16"
alloy-trie = { version = "=0.9.5", features = ["ethereum"] }
async-trait = "0.1.89"
base64 = "0.23.0"
clap = { version = "4.5.51", features = ["derive", "env"] }
hex = "0.4.3"
revm = { version = "=42.0.1", default-features = false, features = ["std"] }
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
sha3 = "0.10.8"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "time", "sync", "macros"] }
url = "2.5.7"

[profile.release]
lto = "thin"
strip = true
